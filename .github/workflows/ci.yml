name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tipos, testes e build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: labmu_test
          POSTGRES_PASSWORD: labmu_test
          POSTGRES_DB: labmu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labmu_test -d labmu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Implementacao/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Implementacao/backend/package-lock.json
      - run: npm ci
      - name: Configurar banco descartável de testes
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          CONFIRM_TEST_DATABASE_RESET=true
          PGSSL=disable
          TEST_DATABASE_URL=postgresql://labmu_test:labmu_test@localhost:5432/labmu_test
          EOF
      - name: Aplicar schema PostgreSQL de teste
        run: psql "postgresql://labmu_test:labmu_test@localhost:5432/labmu_test" -v ON_ERROR_STOP=1 -f supabase/migrations/202611160001_initial_schema.sql
      - name: Verificar tipos
        run: npx tsc --noEmit
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Implementacao/frontend/perfil_adm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Implementacao/frontend/perfil_adm/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências do backend
        working-directory: Implementacao/backend
        run: npm ci
      - name: Dependências do frontend
        working-directory: Implementacao/frontend/perfil_adm
        run: npm ci
      - name: Dependências do e2e
        working-directory: Implementacao/e2e
        run: npm ci
      - name: Navegadores do Playwright
        working-directory: Implementacao/e2e
        run: npx playwright install --with-deps chromium
      - name: Testes e2e
        working-directory: Implementacao/e2e
        run: npx playwright test
      - name: Relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Implementacao/e2e/playwright-report
          retention-days: 7
