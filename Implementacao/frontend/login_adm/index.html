<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>labMU — Autenticação & Login</title>
  <meta name="description" content="Acesso ao sistema de gestão do Laboratório de Prototipagem do MUSARQ." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="login-title">

      <!-- Logo -->
      <div class="brand">
        <svg class="brand__icon" width="40" height="44" viewBox="0 0 40 44" aria-hidden="true">
          <path d="M20 1.5 37 11v22L20 42.5 3 33V11L20 1.5Z" fill="#8B1329" />
          <path d="M20 6 33 13.4v17.2L20 38 7 30.6V13.4L20 6Z" fill="none" stroke="#B8334A" stroke-width="1" />
          <circle cx="20" cy="21" r="6" fill="#F4C542" />
          <circle cx="20" cy="21" r="2.4" fill="#8B1329" />
        </svg>
        <div class="brand__text">
          <span class="brand__name">lab<strong>MU</strong></span>
          <span class="brand__sub">MUSARQ • UNICAP</span>
        </div>
      </div>

      <h1 id="login-title" class="title">Entrar no labMU</h1>
      <p class="subtitle">Credenciais institucionais UNICAP</p>

      <form id="login-form" novalidate>

        <!-- Alerta geral de erro / sucesso -->
        <div id="form-alert" class="alert" role="alert" aria-live="polite" hidden></div>

        <!-- E-mail -->
        <div class="field">
          <label for="email" class="field__label">E-mail Institucional</label>
          <div class="input-wrap">
            <svg class="input-wrap__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2.5" />
              <circle cx="9" cy="11" r="2" />
              <path d="M5.8 16.5c.6-1.6 1.8-2.5 3.2-2.5s2.6.9 3.2 2.5" />
              <path d="M15 9.5h3.5M15 13h3.5" />
            </svg>
            <input type="email" id="email" name="email" class="input"
                   placeholder="tecnico.musarq@unicap.br"
                   autocomplete="username" inputmode="email" required />
          </div>
          <p class="field__error" id="email-error" hidden></p>
        </div>

        <!-- Senha -->
        <div class="field">
          <div class="field__row">
            <label for="password" class="field__label">Chave de Segurança / Senha</label>
            <a href="recuperar-senha.html" class="link link--small">Esqueceu a senha?</a>
          </div>
          <div class="input-wrap">
            <svg class="input-wrap__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" />
              <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
            </svg>
            <input type="password" id="password" name="password" class="input input--password"
                   placeholder="••••••••••••" autocomplete="current-password" required />
            <button type="button" id="toggle-password" class="input-wrap__toggle"
                    aria-label="Mostrar senha" aria-pressed="false">
              <svg id="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg id="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M3 3l18 18" />
                <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              </svg>
            </button>
          </div>
          <p class="field__error" id="password-error" hidden></p>
        </div>

        <!-- Perfil -->
        <fieldset class="segmented" aria-label="Perfil de acesso">
          <label class="segmented__option">
            <input type="radio" name="role" value="tecnico" checked />
            <span class="segmented__radio" aria-hidden="true"></span>
            <span>Técnico</span>
          </label>
          <label class="segmented__option">
            <input type="radio" name="role" value="administrador" />
            <span class="segmented__radio" aria-hidden="true"></span>
            <span>Administrador</span>
          </label>
        </fieldset>
        <p class="hint">Acesso exclusivo a técnicos e administradores credenciados.</p>

        <!-- Botão -->
        <button type="submit" id="submit-btn" class="btn">
          <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" />
            <path d="M10 17l5-5-5-5" />
            <path d="M15 12H3" />
          </svg>
          <span class="btn__label">Entrar no Sistema</span>
          <span class="btn__spinner" aria-hidden="true" hidden></span>
        </button>

        <!-- Lembrar -->
        <label class="check">
          <input type="checkbox" id="remember" name="remember" />
          <span class="check__box" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
          </span>
          <span>Lembrar de mim</span>
        </label>
      </form>

      <hr class="divider" />

      <p class="first-access">
        Primeiro acesso como gestor?
        <a href="cadastro-admin.html" class="link link--strong">
          Criar conta de Administrador
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </a>
      </p>
    </section>

    <footer class="footer">MUSARQ • Universidade Católica de Pernambuco</footer>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
